<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海外仓 WMS 综合管理系统 (发货对账 + 货架绑定/查询)</title>
    <!-- SheetJS 用于导出/读取 Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
            --info: #0891b2;
            --bg: #f8fafc;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #1e293b; font-size: 1.25rem; display: flex; justify-content: space-between; align-items: center; }
        
        /* 系统主导航 Tab */
        .main-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 12px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; background: #e2e8f0; color: #475569; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }

        /* 模式切换按钮 */
        .mode-switch { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-btn { flex: 1; padding: 10px; font-size: 0.95rem; font-weight: bold; border: 2px solid #cbd5e1; border-radius: 8px; background: #f1f5f9; color: #64748b; cursor: pointer; }
        .mode-btn.active-bind { background: #eff6ff; border-color: var(--primary); color: var(--primary); }
        .mode-btn.active-query { background: #ecfeff; border-color: var(--info); color: var(--info); }
        .mode-btn.active-recon { background: #f0fdf4; border-color: var(--success); color: var(--success); }

        /* 扫码核心区域 */
        .scan-box { background: #eff6ff; border: 2px dashed var(--primary); border-radius: 8px; padding: 15px; text-align: center; transition: all 0.3s; }
        .scan-box.query-mode { background: #ecfeff; border-color: var(--info); }
        .scan-box.recon-mode { background: #f0fdf4; border-color: var(--success); }
        .scan-input { width: 100%; padding: 12px; font-size: 1.2rem; border: 2px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; text-align: center; }
        .scan-input:focus { outline: none; border-color: var(--primary); background: #fff; }
        
        /* 状态指示器 */
        .status-banner { padding: 12px; border-radius: 6px; margin-top: 15px; font-weight: bold; text-align: center; font-size: 1.1rem; }
        .status-idle { background: #e2e8f0; color: #475569; }
        .status-active { background: #dbeafe; color: #1e40af; }
        .status-query { background: #cff4fc; color: #055160; }
        .status-warn { background: #fef3c7; color: #92400e; animation: pulse 1s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        /* 快捷控制条码 */
        .cmd-barcodes { display: flex; gap: 10px; margin-top: 15px; }
        .cmd-card { flex: 1; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; text-align: center; font-size: 0.8rem; }
        .cmd-card code { display: block; background: #f1f5f9; padding: 4px; margin-top: 4px; font-weight: bold; color: #0f172a; }

        /* 表格样式 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
        th { background: #f1f5f9; color: #475569; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; margin-right: 4px; display: inline-block; margin-bottom: 2px;}

        /* 差异显示样式 */
        .diff-diff { color: var(--danger); font-weight: bold; }
        .diff-match { color: var(--success); font-weight: bold; }

        /* 按钮 */
        .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-success { background: var(--success); }
        .btn-audio { background: #8b5cf6; }
        .file-input { margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 顶部音频授权与状态 -->
    <div class="card" style="text-align: center;">
        <button id="startAudioBtn" class="btn btn-audio" onclick="initAudio()">🔊 点击开启语音助手</button>
        <span id="audioStatus" style="margin-left: 10px; color: #64748b; font-size: 0.9rem;">(点击后开启全程语音提示)</span>
    </div>

    <!-- 主系统切换 Tab -->
    <div class="main-tabs">
        <button id="tabReconBtn" class="tab-btn active" onclick="switchTab('RECON')">📦 1. 国内发货与海外对账</button>
        <button id="tabShelfBtn" class="tab-btn" onclick="switchTab('SHELF')">📍 2. 货架库位绑定与查询</button>
    </div>

    <!-- ==================== 模块一：国内发货与海外仓对账 ==================== -->
    <div id="moduleRecon">
        <!-- 发货数据导入区 -->
        <div class="card">
            <h2>📥 1. 导入国内发货清单 (Excel)</h2>
            <p style="color: #64748b; font-size: 0.85rem;">请上传包含【商品SKU】和【发货数量】字段的 Excel 表格：</p>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="file-input" onchange="importDomesticExcel(event)">
            <span id="importStatus" style="font-weight: bold; margin-left: 10px;"></span>
        </div>

        <!-- 海外仓扫描作业区 -->
        <div class="card">
            <h2>🚚 2. 海外仓拆箱收货扫描</h2>
            <div id="scanBoxRecon" class="scan-box recon-mode">
                <input type="text" id="scannerRecon" class="scan-input" placeholder="请扫描到货商品的 SKU 条码..." autocomplete="off">
            </div>
            <div id="statusBannerRecon" class="status-banner status-idle">
                等待扫描到货商品...
            </div>
        </div>

        <!-- 差异对比结果与导出 -->
        <div class="card">
            <h2>
                📊 3. 收发货差异对比表
                <button class="btn btn-success" onclick="exportReconReport()">📥 导出对账差异 Excel</button>
            </h2>
            <table>
                <thead>
                    <tr>
                        <th>商品 SKU</th>
                        <th>国内发货数</th>
                        <th>海外已扫数</th>
                        <th>对账状态 / 差异</th>
                    </tr>
                </thead>
                <tbody id="reconTableBody">
                    <tr><td colspan="4" style="text-align: center; color: #94a3b8;">暂无数据，请先导入国内发货清单或开始扫描</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ==================== 模块二：货架库位绑定与查询 ==================== -->
    <div id="moduleShelf" style="display: none;">
        <!-- 扫码作业区 -->
        <div class="card">
            <h2>📦 货架上架与查询作业区</h2>
            
            <!-- 模式切换组件 -->
            <div class="mode-switch">
                <button id="modeBindBtn" class="mode-btn active-bind" onclick="switchShelfMode('BIND')">➕ 绑盘 / 上架模式</button>
                <button id="modeQueryBtn" class="mode-btn" onclick="switchShelfMode('QUERY')">🔍 快速查询模式</button>
            </div>

            <div id="scanBoxShelf" class="scan-box">
                <input type="text" id="scannerShelf" class="scan-input" placeholder="请在此处扫描货架位或 SKU..." autocomplete="off">
            </div>

            <div id="statusBannerShelf" class="status-banner status-idle">
                等待扫描货架位条码（如 A-01-01）...
            </div>

            <div class="cmd-barcodes">
                <div class="cmd-card">扫码确认<code>CMD_CONFIRM</code></div>
                <div class="cmd-card">切换上架模式<code>CMD_MODE_BIND</code></div>
                <div class="cmd-card">切换查询模式<code>CMD_MODE_QUERY</code></div>
            </div>
        </div>

        <!-- 绑定关系预览与导出 -->
        <div class="card">
            <h2>
                📋 实时库位映射表
                <button class="btn btn-success" onclick="exportShelfToExcel()">📥 导出库位映射 Excel</button>
            </h2>
            <table>
                <thead>
                    <tr>
                        <th>商品 SKU</th>
                        <th>绑定货架位 (多位)</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="shelfTableBody">
                    <!-- 动态渲染 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ==================== 全局状态与语音 ====================
    let activeTab = "RECON"; // "RECON" 或 "SHELF"
    let isAudioReady = false;

    function speak(text, tone = 'normal') {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 1.2;
            if (tone === 'warn') utterance.pitch = 1.3;
            if (tone === 'success') utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    }

    function initAudio() {
        isAudioReady = true;
        speak("语音助手已启动");
        document.getElementById('startAudioBtn').innerText = "🔊 语音助手运行中";
        document.getElementById('startAudioBtn').style.background = "#16a34a";
        document.getElementById('audioStatus').innerText = "语音已激活";
        focusCurrentScanner();
    }

    function switchTab(tab) {
        activeTab = tab;
        document.getElementById('moduleRecon').style.display = (tab === 'RECON') ? 'block' : 'none';
        document.getElementById('moduleShelf').style.display = (tab === 'SHELF') ? 'block' : 'none';
        
        document.getElementById('tabReconBtn').className = (tab === 'RECON') ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tabShelfBtn').className = (tab === 'SHELF') ? 'tab-btn active' : 'tab-btn';

        if (tab === 'RECON') {
            speak("已进入国内发货对账模块");
        } else {
            speak("已进入货架绑定与查询模块");
        }
        focusCurrentScanner();
    }

    function focusCurrentScanner() {
        if (activeTab === 'RECON') {
            document.getElementById('scannerRecon').focus();
        } else {
            document.getElementById('scannerShelf').focus();
        }
    }

    document.addEventListener('click', (e) => {
        if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'A') {
            focusCurrentScanner();
        }
    });

    // ==================== 模块一：国内发货与海外仓对账数据逻辑 ====================
    let domesticData = {}; // { "SKU_A": 10, "SKU_B": 20 }
    let overseasScanData = {}; // { "SKU_A": 10, "SKU_B": 19 }

    const scannerRecon = document.getElementById('scannerRecon');

    scannerRecon.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const sku = this.value.trim().toUpperCase();
            this.value = '';
            if (sku) handleReconScan(sku);
        }
    });

    function importDomesticExcel(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);

            domesticData = {};
            jsonData.forEach(row => {
                // 自动识别各种列名
                const sku = row['商品SKU'] || row['SKU'] || row['sku'] || row['商品编码'];
                const qty = parseInt(row['发货数量'] || row['数量'] || row['发货数'] || 0);
                if (sku) {
                    const cleanSKU = String(sku).trim().toUpperCase();
                    domesticData[cleanSKU] = (domesticData[cleanSKU] || 0) + qty;
                }
            });

            document.getElementById('importStatus').innerText = `✅ 成功导入 ${Object.keys(domesticData).length} 个 SKU`;
            speak(`发货清单导入成功，共 ${Object.keys(domesticData).length} 种商品`);
            renderReconTable();
        };
        reader.readAsArrayBuffer(file);
    }

    function handleReconScan(sku) {
        overseasScanData[sku] = (overseasScanData[sku] || 0) + 1;
        const currentScanned = overseasScanData[sku];
        const targetQty = domesticData[sku] || 0;

        if (!(sku in domesticData)) {
            updateReconStatus(`⚠️ 警告：SKU [ ${sku} ] 不在国内发货清单中！(已扫 ${currentScanned} 件)`, 'warn');
            speak(`警告，该商品不在发货清单中`, 'warn');
        } else if (currentScanned > targetQty) {
            updateReconStatus(`⚠️ 警告：SKU [ ${sku} ] 超发/多扫！应发 ${targetQty}，已扫 ${currentScanned}`, 'warn');
            speak(`警告，数量超出发货数`, 'warn');
        } else if (currentScanned === targetQty) {
            updateReconStatus(`✅ [ ${sku} ] 扫码成功，该商品数量已完全匹配 (${currentScanned}/${targetQty})`, 'active');
            speak(`商品已齐齐全`);
        } else {
            updateReconStatus(`✅ [ ${sku} ] 扫码成功，已扫 ${currentScanned} / 应收 ${targetQty}`, 'active');
            speak(`扫码成功，当前第 ${currentScanned} 件`);
        }

        renderReconTable();
    }

    function updateReconStatus(msg, type) {
        const banner = document.getElementById('statusBannerRecon');
        banner.innerText = msg;
        banner.className = `status-banner status-${type}`;
    }

    function renderReconTable() {
        const tbody = document.getElementById('reconTableBody');
        tbody.innerHTML = '';

        const allSKUs = Array.from(new Set([...Object.keys(domesticData), ...Object.keys(overseasScanData)]));

        if (allSKUs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #94a3b8;">暂无数据</td></tr>';
            return;
        }

        allSKUs.forEach(sku => {
            const sendQty = domesticData[sku] || 0;
            const recvQty = overseasScanData[sku] || 0;
            const diff = recvQty - sendQty;

            let statusHTML = '';
            if (!(sku in domesticData)) {
                statusHTML = `<span class="diff-diff">⚠️ 盘盈/额外多出 (+${recvQty})</span>`;
            } else if (diff === 0) {
                statusHTML = `<span class="diff-match">✅ 完全匹配 (${recvQty}/${sendQty})</span>`;
            } else if (diff < 0) {
                statusHTML = `<span class="diff-diff">❌ 缺少 ${Math.abs(diff)} 件 (已收 ${recvQty}/${sendQty})</span>`;
            } else {
                statusHTML = `<span class="diff-diff">⚠️ 多出 ${diff} 件 (已收 ${recvQty}/${sendQty})</span>`;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${sku}</strong></td>
                <td>${sendQty}</td>
                <td>${recvQty}</td>
                <td>${statusHTML}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function exportReconReport() {
        const allSKUs = Array.from(new Set([...Object.keys(domesticData), ...Object.keys(overseasScanData)]));
        if (allSKUs.length === 0) {
            alert("暂无数据可导出！");
            return;
        }

        const reportData = allSKUs.map(sku => {
            const sendQty = domesticData[sku] || 0;
            const recvQty = overseasScanData[sku] || 0;
            const diff = recvQty - sendQty;
            let resultText = "完全匹配";
            if (!(sku in domesticData)) resultText = "不在发货清单(多扫)";
            else if (diff < 0) resultText = `少收 ${Math.abs(diff)} 件`;
            else if (diff > 0) resultText = `多收 ${diff} 件`;

            return {
                "商品 SKU": sku,
                "国内发货数量": sendQty,
                "海外实收扫描": recvQty,
                "差异数量": diff,
                "对账结论": resultText
            };
        });

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(reportData);
        XLSX.utils.book_append_sheet(wb, ws, "发货收货差异分析");
        const dateStr = new Date().toISOString().slice(0, 10);
        XLSX.writeFile(wb, `国内发货与海外仓对账单_${dateStr}.xlsx`);
        speak("对账差异表导出成功");
    }

    // ==================== 模块二：货架绑定与查询逻辑 ====================
    let bindings = {}; 
    let currentShelfMode = "BIND";
    let currentShelf = "";
    let pendingSKU = "";

    const scannerShelf = document.getElementById('scannerShelf');
    const shelfPattern = /^[A-Z]-\d{2}-\d{2}$/;

    scannerShelf.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const code = this.value.trim().toUpperCase();
            this.value = '';
            if (code) handleShelfScan(code);
        }
    });

    function switchShelfMode(mode) {
        currentShelfMode = mode;
        pendingSKU = "";
        const bindBtn = document.getElementById('modeBindBtn');
        const queryBtn = document.getElementById('modeQueryBtn');
        const scanBox = document.getElementById('scanBoxShelf');

        if (mode === 'BIND') {
            bindBtn.className = "mode-btn active-bind";
            queryBtn.className = "mode-btn";
            scanBox.className = "scan-box";
            scannerShelf.placeholder = "上架模式：请扫描货架位或 SKU...";
            updateShelfStatus(currentShelf ? `已锁定货架：[ ${currentShelf} ]` : `等待扫描货架位条码（如 A-01-01）...`, 'active');
            speak("已切换至上架模式");
        } else {
            bindBtn.className = "mode-btn";
            queryBtn.className = "mode-btn active-query";
            scanBox.className = "scan-box query-mode";
            scannerShelf.placeholder = "查询模式：扫描货架位或 SKU 查对应关系...";
            updateShelfStatus(`🔍 查询模式：扫描货架位查 SKU，或扫描 SKU 查货架位`, 'query');
            speak("已切换至查询模式");
        }
        scannerShelf.focus();
    }

    function handleShelfScan(code) {
        if (code === 'CMD_MODE_BIND') { switchShelfMode('BIND'); return; }
        if (code === 'CMD_MODE_QUERY') { switchShelfMode('QUERY'); return; }
        if (code === 'CMD_CONFIRM') { confirmPending(); return; }

        if (currentShelfMode === 'QUERY') {
            // 查询逻辑
            if (shelfPattern.test(code)) {
                const foundSKUs = [];
                for (const [sku, shelves] of Object.entries(bindings)) {
                    if (shelves.includes(code)) foundSKUs.push(sku);
                }
                if (foundSKUs.length > 0) {
                    updateShelfStatus(`📍 货架 [ ${code} ] 存放商品 (${foundSKUs.length}种): ${foundSKUs.join(', ')}`, 'query');
                    speak(`货架 ${code} 包含 ${foundSKUs.length} 个商品`);
                } else {
                    updateShelfStatus(`ℹ️ 货架 [ ${code} ] 当前为空`, 'idle');
                    speak(`货架 ${code} 为空`);
                }
            } else {
                const shelves = bindings[code];
                if (shelves && shelves.length > 0) {
                    updateShelfStatus(`📦 商品 [ ${code} ] 位于货架: ${shelves.join(', ')}`, 'query');
                    speak(`商品在 ${shelves.join(' 和 ')} 货架`);
                } else {
                    updateShelfStatus(`⚠️ 未查询到商品 [ ${code} ] 的绑定信息`, 'warn');
                    speak(`未查询到该商品`, 'warn');
                }
            }
        } else {
            // 上架逻辑
            if (shelfPattern.test(code)) {
                currentShelf = code;
                pendingSKU = "";
                updateShelfStatus(`已锁定目标货架：[ ${currentShelf} ]，请扫描商品 SKU`, 'active');
                speak(`已锁定货架 ${currentShelf}`, 'success');
                return;
            }

            if (!currentShelf) {
                updateShelfStatus(`⚠️ 请先扫描货架位条码（如 A-01-01）！`, 'warn');
                speak("请先扫描货架位", 'warn');
                return;
            }

            if (pendingSKU) {
                if (code === pendingSKU) {
                    executeBinding(pendingSKU, currentShelf);
                    pendingSKU = "";
                } else {
                    speak("已取消上一步", 'normal');
                    pendingSKU = "";
                    handleShelfScan(code);
                }
                return;
            }

            const existingShelves = bindings[code] || [];
            if (existingShelves.includes(currentShelf)) {
                updateShelfStatus(`ℹ️ 商品 [ ${code} ] 已在当前货架 [ ${currentShelf} ] 中`, 'active');
                speak(`商品已在当前货架`);
                return;
            }

            if (existingShelves.length > 0) {
                pendingSKU = code;
                updateShelfStatus(`⚠️ 警告：[ ${code} ] 已在货架 [ ${existingShelves.join(', ')} ]！再扫一次确认加挂`, 'warn');
                speak(`警告，该商品已在其他货架，再扫一次确认`, 'warn');
                return;
            }

            executeBinding(code, currentShelf);
        }
    }

    function executeBinding(sku, shelf) {
        if (!bindings[sku]) bindings[sku] = [];
        bindings[sku].push(shelf);
        updateShelfStatus(`✅ 成功：[ ${sku} ] ➔ 绑定至 [ ${shelf} ]`, 'active');
        speak(`上架成功`);
        renderShelfTable();
    }

    function confirmPending() {
        if (pendingSKU && currentShelf) {
            executeBinding(pendingSKU, currentShelf);
            pendingSKU = "";
        }
    }

    function unbind(sku, shelf) {
        if (bindings[sku]) {
            bindings[sku] = bindings[sku].filter(s => s !== shelf);
            if (bindings[sku].length === 0) delete bindings[sku];
            renderShelfTable();
            speak("已解除绑定");
        }
    }

    function updateShelfStatus(msg, type) {
        const banner = document.getElementById('statusBannerShelf');
        banner.innerText = msg;
        banner.className = `status-banner status-${type}`;
    }

    function renderShelfTable() {
        const tbody = document.getElementById('shelfTableBody');
        tbody.innerHTML = '';
        for (const [sku, shelves] of Object.entries(bindings)) {
            const tr = document.createElement('tr');
            const shelfBadges = shelves.map(s => 
                `<span class="badge">${s} <a href="#" onclick="unbind('${sku}', '${s}')" style="color:#dc2626;text-decoration:none;margin-left:4px;">×</a></span>`
            ).join(' ');

            tr.innerHTML = `
                <td><strong>${sku}</strong></td>
                <td>${shelfBadges}</td>
                <td><button onclick="delete bindings['${sku}']; renderShelfTable();" style="color:red;border:none;background:none;cursor:pointer;">清空</button></td>
            `;
            tbody.appendChild(tr);
        }
    }

    function exportShelfToExcel() {
        if (Object.keys(bindings).length === 0) {
            alert("暂无绑定数据！");
            return;
        }

        const skuData = [];
        for (const [sku, shelves] of Object.entries(bindings)) {
            skuData.push({ "商品 SKU": sku, "所在货架位": shelves.join(', '), "货架数量": shelves.length });
        }

        const wb = XLSX.utils.book_new();
        const wsSKU = XLSX.utils.json_to_sheet(skuData);
        XLSX.utils.book_append_sheet(wb, wsSKU, "库位映射表");
        const dateStr = new Date().toISOString().slice(0, 10);
        XLSX.writeFile(wb, `货架位绑定映射表_${dateStr}.xlsx`);
        speak("库位映射表导出成功");
    }
</script>

</body>
</html>
