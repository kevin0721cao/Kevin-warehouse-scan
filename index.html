<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>手机扫码入库</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;background:#eef2f7;color:#0f172a;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif
    }
    .app{max-width:820px;margin:auto;min-height:100vh;padding:12px 12px 28px}
    .header{display:flex;align-items:center;justify-content:space-between;margin:5px 0 12px}
    h1{font-size:23px;margin:0}
    .badge{background:#dcfce7;color:#166534;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800}
    .card{
      background:#fff;border-radius:18px;padding:13px;margin-bottom:12px;
      box-shadow:0 6px 24px rgba(15,23,42,.07)
    }
    label{display:block;color:#64748b;font-size:13px;margin-bottom:6px}
    input,button{width:100%;min-height:48px;border-radius:12px;font-size:16px}
    input{border:1px solid #cbd5e1;padding:10px 12px;background:#fff}
    button{border:0;padding:10px 12px;font-weight:800;cursor:pointer}
    .primary{background:#2563eb;color:#fff}
    .success{background:#16a34a;color:#fff}
    .dark{background:#0f172a;color:#fff}
    .light{background:#e2e8f0;color:#0f172a}
    .danger{background:#fee2e2;color:#991b1b}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    #reader{background:#111827;border-radius:15px;overflow:hidden;min-height:250px}
    #reader video{object-fit:cover!important}
    #status{
      margin-top:10px;padding:11px 12px;border-radius:11px;
      background:#eff6ff;color:#1d4ed8;font-size:14px;font-weight:800
    }
    .hint{font-size:12px;color:#64748b;line-height:1.55;margin-top:8px}
    .manual{display:grid;grid-template-columns:1fr 95px;gap:9px}
    .manual button{grid-column:1/-1}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
    .stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:13px;padding:10px;text-align:center}
    .stat span{display:block;font-size:25px;font-weight:900;margin-top:2px}
    .table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:13px;max-height:380px}
    table{width:100%;border-collapse:collapse;min-width:700px}
    th,td{padding:8px;border-bottom:1px solid #e2e8f0;font-size:14px;text-align:left}
    th{position:sticky;top:0;background:#f8fafc;z-index:1}
    td input{min-height:36px;padding:6px 8px;font-size:14px}
    .del{width:auto;min-height:34px;padding:6px 10px;background:#fee2e2;color:#991b1b}
    .empty{text-align:center;padding:28px;color:#94a3b8}
    .new{animation:flash .7s ease}
    @keyframes flash{0%{background:#bbf7d0}100%{background:#fff}}
    .footer{font-size:12px;color:#64748b;text-align:center}
    @media(max-width:600px){
      .grid3{grid-template-columns:1fr 1fr}
      .grid3 button:last-child{grid-column:1/-1}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>📦 手机扫码入库</h1>
    <div class="badge">连续扫描</div>
  </div>

  <div class="card">
    <div class="grid2">
      <div>
        <label>客户名称</label>
        <input id="customer" placeholder="例如：ABC客户">
      </div>
      <div>
        <label>批次 / 柜号</label>
        <input id="batch" placeholder="例如：CTN-01">
      </div>
    </div>
  </div>

  <div class="card">
    <div id="reader"></div>
    <div class="grid2" style="margin-top:10px">
      <button id="startBtn" class="primary">开始连续扫描</button>
      <button id="stopBtn" class="danger">停止扫描</button>
    </div>
    <div id="status">点击“开始连续扫描”，并允许使用后置摄像头。</div>
    <div class="hint">扫到一个条形码后会自动新增一行，并马上继续等待下一个条形码。</div>
  </div>

  <div class="card">
    <label>手动输入 / 蓝牙扫码枪</label>
    <div class="manual">
      <input id="manualCode" autocomplete="off" placeholder="输入条形码，按回车也可">
      <input id="manualQty" type="number" min="1" value="1">
      <button id="addBtn" class="primary">新增一行</button>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat">记录行数<span id="rowCount">0</span></div>
      <div class="stat">总数量<span id="qtyCount">0</span></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>序号</th>
            <th>扫描时间</th>
            <th>条形码</th>
            <th>数量</th>
            <th>型号 / 备注</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty">暂时没有入库记录</div>
    </div>

    <div class="grid3" style="margin-top:10px">
      <button id="excelBtn" class="success">导出 Excel</button>
      <button id="csvBtn" class="dark">导出 CSV</button>
      <button id="undoBtn" class="light">撤销最后一条</button>
    </div>

    <div class="grid2" style="margin-top:9px">
      <button id="clearBtn" class="danger">清空全部</button>
      <button id="newBatchBtn" class="light">新建批次</button>
    </div>
  </div>

  <div class="footer">数据自动保存在当前手机浏览器中。</div>
</div>

<script>
(() => {
  const STORAGE_KEY = "kevin_warehouse_mobile_scan_v1";
  const records = [];
  let scanner = null;
  let scanning = false;
  let lastCode = "";
  let lastScanAt = 0;
  const duplicateDelay = 1500;

  const $ = id => document.getElementById(id);

  function nowText() {
    return new Date().toLocaleString("zh-CN", { hour12: false });
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 960;
      gain.gain.value = 0.12;
      osc.start();
      osc.stop(ctx.currentTime + 0.09);
    } catch (_) {}
    if (navigator.vibrate) navigator.vibrate(80);
  }

  function setStatus(text, ok = false) {
    const status = $("status");
    status.textContent = text;
    status.style.background = ok ? "#dcfce7" : "#eff6ff";
    status.style.color = ok ? "#166534" : "#1d4ed8";
  }

  function addRecord(code, qty = 1) {
    code = String(code || "").trim();
    qty = Math.max(1, parseInt(qty || 1, 10));

    if (!code) {
      setStatus("条形码不能为空。");
      return;
    }

    records.push({
      time: nowText(),
      barcode: code,
      qty,
      note: ""
    });

    render(true);
    saveLocal();
    beep();
    setStatus(`已记录：${code}，请继续扫描下一个。`, true);
  }

  function render(highlightLast = false) {
    const tbody = $("tbody");
    tbody.innerHTML = "";

    records.forEach((r, index) => {
      const tr = document.createElement("tr");
      if (highlightLast && index === records.length - 1) tr.className = "new";
      tr.innerHTML = `
        <td>${index + 1}</td>
        <td>${escapeHtml(r.time)}</td>
        <td>${escapeHtml(r.barcode)}</td>
        <td><input class="qty-input" data-index="${index}" type="number" min="1" value="${r.qty}"></td>
        <td><input class="note-input" data-index="${index}" value="${escapeHtml(r.note)}" placeholder="颜色、尺寸、型号"></td>
        <td><button class="del" data-index="${index}">删除</button></td>
      `;
      tbody.appendChild(tr);
    });

    $("empty").style.display = records.length ? "none" : "block";
    $("rowCount").textContent = records.length;
    $("qtyCount").textContent = records.reduce((sum, r) => sum + Number(r.qty || 0), 0);

    tbody.querySelectorAll(".qty-input").forEach(input => {
      input.addEventListener("change", e => {
        const i = Number(e.target.dataset.index);
        records[i].qty = Math.max(1, parseInt(e.target.value || 1, 10));
        render();
        saveLocal();
      });
    });

    tbody.querySelectorAll(".note-input").forEach(input => {
      input.addEventListener("input", e => {
        records[Number(e.target.dataset.index)].note = e.target.value;
        saveLocal();
      });
    });

    tbody.querySelectorAll(".del").forEach(btn => {
      btn.addEventListener("click", e => {
        records.splice(Number(e.target.dataset.index), 1);
        render();
        saveLocal();
      });
    });
  }

  function onScanSuccess(decodedText) {
    const current = Date.now();
    if (decodedText === lastCode && current - lastScanAt < duplicateDelay) return;

    lastCode = decodedText;
    lastScanAt = current;
    addRecord(decodedText, 1);
  }

  async function startScanner() {
    if (scanning) return;

    if (typeof Html5Qrcode === "undefined") {
      setStatus("扫码组件加载失败，请确认手机已经联网。");
      return;
    }

    scanner = scanner || new Html5Qrcode("reader");

    const config = {
      fps: 12,
      qrbox: { width: 290, height: 160 },
      aspectRatio: 1.5,
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.QR_CODE
      ]
    };

    try {
      await scanner.start(
        { facingMode: { exact: "environment" } },
        config,
        onScanSuccess,
        () => {}
      );
      scanning = true;
      setStatus("连续扫描中：请把条形码放入扫描框。", true);
    } catch (_) {
      try {
        await scanner.start(
          { facingMode: "environment" },
          config,
          onScanSuccess,
          () => {}
        );
        scanning = true;
        setStatus("连续扫描中：请把条形码放入扫描框。", true);
      } catch (err) {
        console.error(err);
        setStatus("无法启动摄像头。请使用 HTTPS 地址打开，并允许摄像头权限。");
      }
    }
  }

  async function stopScanner() {
    if (!scanner || !scanning) return;
    try {
      await scanner.stop();
      scanning = false;
      setStatus("扫描已停止。");
    } catch (err) {
      console.error(err);
    }
  }

  function exportRows() {
    const batch = $("batch").value.trim();
    const customer = $("customer").value.trim();

    return records.map((r, i) => ({
      "序号": i + 1,
      "客户名称": customer,
      "入库批次/柜号": batch,
      "扫描时间": r.time,
      "条形码": r.barcode,
      "数量": r.qty,
      "型号/备注": r.note
    }));
  }

  function exportExcel() {
    if (!records.length) {
      alert("暂时没有记录可以导出。");
      return;
    }

    if (typeof XLSX === "undefined") {
      alert("Excel 组件加载失败，请确认手机已经联网。");
      return;
    }

    const ws = XLSX.utils.json_to_sheet(exportRows());
    ws["!cols"] = [
      { wch: 8 }, { wch: 18 }, { wch: 20 },
      { wch: 22 }, { wch: 24 }, { wch: 10 }, { wch: 28 }
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "入库记录");
    XLSX.writeFile(wb, `入库记录_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  function exportCsv() {
    if (!records.length) {
      alert("暂时没有记录可以导出。");
      return;
    }

    const rows = exportRows();
    const headers = Object.keys(rows[0]);
    const csv = [
      headers.join(","),
      ...rows.map(row => headers.map(h => {
        const value = String(row[h] ?? "").replaceAll('"', '""');
        return `"${value}"`;
      }).join(","))
    ].join("\r\n");

    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `入库记录_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function saveLocal() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      customer: $("customer").value,
      batch: $("batch").value,
      records
    }));
  }

  function loadLocal() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (!saved) return;

      $("customer").value = saved.customer || "";
      $("batch").value = saved.batch || "";

      if (Array.isArray(saved.records)) {
        records.push(...saved.records);
      }

      render();
    } catch (_) {}
  }

  $("startBtn").addEventListener("click", startScanner);
  $("stopBtn").addEventListener("click", stopScanner);
  $("excelBtn").addEventListener("click", exportExcel);
  $("csvBtn").addEventListener("click", exportCsv);

  $("addBtn").addEventListener("click", () => {
    addRecord($("manualCode").value, $("manualQty").value);
    $("manualCode").value = "";
    $("manualQty").value = 1;
    $("manualCode").focus();
  });

  $("manualCode").addEventListener("keydown", e => {
    if (e.key === "Enter") $("addBtn").click();
  });

  $("undoBtn").addEventListener("click", () => {
    if (!records.length) return;
    records.pop();
    render();
    saveLocal();
    setStatus("已撤销最后一条记录。");
  });

  $("clearBtn").addEventListener("click", () => {
    if (!records.length) return;
    if (!confirm("确定清空全部入库记录吗？")) return;

    records.length = 0;
    render();
    saveLocal();
    setStatus("全部记录已清空。");
  });

  $("newBatchBtn").addEventListener("click", () => {
    if (records.length && !confirm("新建批次会清空当前记录，确定继续吗？")) return;

    records.length = 0;
    $("customer").value = "";
    $("batch").value = "";
    render();
    saveLocal();
    setStatus("已建立新批次。");
  });

  $("customer").addEventListener("input", saveLocal);
  $("batch").addEventListener("input", saveLocal);

  loadLocal();
})();
</script>
</body>
</html>
